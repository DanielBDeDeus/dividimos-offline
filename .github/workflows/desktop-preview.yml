name: Windows portable preview
on:
  workflow_dispatch:
  push:
    branches: ['feat/offline-desktop']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Electron persistence and backup smoke test
        run: npm run test:desktop
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: DividimOS-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
