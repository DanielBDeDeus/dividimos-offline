name: Release - Portable Offline
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package version
        shell: bash
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: npm run build
      - name: Build portable desktop package
        run: npx electron-builder --${{ matrix.target }} --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.exe *.AppImage > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
