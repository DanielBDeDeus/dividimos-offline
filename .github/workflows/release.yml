name: Release - Portable Offline
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: npm run build
      - name: Electron persistence, backup and offline smoke
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Trivy vulnerability scan (report-only)
        if: runner.os == 'Linux'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload security evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-security-report
          path: trivy-report.txt
          if-no-files-found: error
      - name: Build portable desktop package
        run: npx electron-builder --${{ matrix.target }} --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.exe *.AppImage > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DividimOS Offline ${{ steps.version.outputs.tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Aplicativo offline de finanças domésticas. Baixe o EXE portátil (Windows x64) ou AppImage (Linux x64).
            Não requer Node.js, conta, servidor ou Docker no computador do usuário. Dados locais não sincronizam entre PCs.
            SHA256SUMS.txt permite conferir a integridade do download.
            CI executa testes Vitest, API/SQLite, build, teste Electron no Windows e scan Trivy informativo.
            O teste Electron simula seletores de arquivos; execução manual do EXE/AppImage e da rede física desligada não são atestadas.
            Binários sem assinatura de código. Exporte um backup antes de trocar de versão.
