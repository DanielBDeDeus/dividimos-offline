name: CI - DividimOS Offline
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'demo/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Unit tests (Vitest)
        run: npm test
      - name: API + SQLite tests
        run: npm run test:api
      - name: Production build
        run: npm run build
      - name: Upload versioned frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Trivy vulnerability scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-report.txt
          if-no-files-found: ignore
